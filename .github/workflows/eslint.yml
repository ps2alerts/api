---
name: ESLint
on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: install node v16
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: yarn install
        run: yarn install

      - name: yarn run lint
        run: yarn run lint
